<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register - Electronics Store</title>

    <link rel="stylesheet" href="CSS/style.css">

</head>


<body class="auth-body">


    <div class="auth-box">

        <h2>
            Create Account
        </h2>


        <p>
            Create your Electronics Store account
        </p>


        <form id="registerForm">


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="John Doe"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="name@example.com"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="••••••••"
                    required>

            </div>


            <button
                type="submit"
                class="auth-btn">

                Register

            </button>


        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="login.html">
                Login here
            </a>

        </div>


        <div class="auth-back">

            <a href="index.html">

                &larr; Back to Store

            </a>

        </div>

    </div>


    <script src="JS/script.js"></script>

</body>

</html>
