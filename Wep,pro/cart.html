<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Your Cart - Electronics Store</title>

    <link rel="stylesheet" href="CSS/style.css">

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header>

        <nav class="navbar">

            <div class="logo">

                <h1>
                    Electronics <span>Store</span>
                </h1>

            </div>


            <ul class="nav-links">

                <li>
                    <a href="index.html#home">
                        HOME
                    </a>
                </li>

                <li>
                    <a href="index.html#monitor">
                        MONITOR
                    </a>
                </li>

                <li>
                    <a href="index.html#accessories">
                        ACCESSORIES
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        ABOUT US
                    </a>
                </li>

            </ul>


            <div class="auth-links">

                <a href="cart.html"
                   class="cart-link active-cart">

                    CART (<span id="cartCount">0</span>)

                </a>

                <a href="login.html">
                    LOGIN
                </a>

                <a href="register.html">
                    REGISTER
                </a>

            </div>

        </nav>

    </header>


    <!-- ================= CART ================= -->

    <main class="simple-cart-container">

        <h2>
            My Shopping Cart
        </h2>


        <!-- Empty cart message -->

        <p id="emptyCartMsg"
           class="empty-cart-msg">

            Your cart is empty.
            Go find something cool!

        </p>


        <!-- Cart Table -->

        <table
            class="simple-cart-table"
            id="cartTable">

            <thead>

                <tr>

                    <th>
                        Product Image
                    </th>

                    <th>
                        Item Name
                    </th>

                    <th>
                        Quantity
                    </th>

                    <th>
                        Price
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="cartBody">

                <!-- JavaScript adds products here -->

            </tbody>

        </table>


        <!-- Total -->

        <div class="simple-cart-total">

            <h3>

                Total Amount:

                $

                <span id="cartTotalAmount">
                    0.00
                </span>

            </h3>


<button class="simple-checkout-btn" onclick="goToCheckout()">
    Checkout
</button>

        </div>

    </main>


    <!-- JavaScript -->

    <script src="JS/script.js"></script>

</body>

</html>
